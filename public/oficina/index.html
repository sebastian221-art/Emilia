<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oficina · Emilia OS</title>
<link rel="stylesheet" href="/comun/hud.css" />
<link rel="stylesheet" href="/oficina/oficina.css" />
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body class="oficina">
<div id="escena"></div>
<div id="etiquetas"></div>

<header class="barra vidrio">
  <div class="marca-os"><span class="glifo"></span><div><b>EMILIA</b><span>OS · centro de mando</span></div></div>
  <div class="chips" id="chips"></div>
  <div class="metricas" id="metricas"></div>
</header>

<section class="pulso vidrio" id="pulso"><div class="tit">Pulso del equipo</div><div class="lista" id="pulsoLista"></div></section>

<section class="mando">
  <div class="comms vidrio" id="comms" hidden></div>
  <form class="consola vidrio" id="consola" autocomplete="off">
    <span class="prompt">›</span>
    <input id="pedido" placeholder="Pídele algo a la oficina…  (Emilia lo reparte)" />
    <button type="submit" class="enviar" title="Enviar">⏎</button>
  </form>
</section>

<div class="controles vidrio">
  <button id="bGiro" title="Giro 360°">⟳ <span>360°</span></button>
  <button id="bVista" title="Volver a la vista general">◎</button>
  <button id="bEtiquetas" title="Mostrar u ocultar nombres">Aa</button>
</div>

<aside class="estacion vidrio" id="estacion" hidden>
  <button class="cerrar" id="cerrarEst" title="Cerrar">✕</button>
  <div id="estCont"></div>
</aside>

<div class="cargando" id="cargando"><div class="anillo"></div><div>Iniciando la oficina…</div></div>
<script type="module" src="/oficina/oficina.js"></script>
</body>
</html>
