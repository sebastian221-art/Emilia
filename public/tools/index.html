<!DOCTYPE html>
<!-- ARCHIVO: public/tools/index.html  (borrar public/tools/tools.js y public/tools/def-tool.js) -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tools · Emilia</title>
<link rel="stylesheet" href="/comun/estilos.css" />
<style>
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 14px; height: calc(100vh - 170px); }
.izq { overflow-y: auto; }
.izq h4 { font-size: 10px; color: var(--e-text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 4px; }
.item { padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.item:hover { background: var(--e-surface); }
.item.activo { background: var(--e-accent-bg); border-color: var(--e-accent); }
.item .n { font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel { background: var(--e-surface-1); border: 1px solid var(--e-border); border-radius: 14px; padding: 18px; overflow-y: auto; }
.panel h2 { font-size: 17px; margin: 0; font-family: monospace; }
.sec { margin-top: 16px; }
.sec h3 { font-size: 11px; color: var(--e-text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
.vacio { text-align: center; padding: 60px 20px; color: var(--e-text-muted); }
</style>
</head>
<body>
<nav>
  <span class="marca">Emilia</span>
  <a href="/crear">Crear agente</a>
  <a href="/agentes">Ver agentes</a>
  <a href="/skills">Skills</a>
  <a href="/tools" class="activo">Tools</a>
  <a href="/flujos">Flujos</a>
  <a href="/codigo">Código</a>
  <a href="/empresa">Empresa</a>
  <a href="/actividad">Actividad</a>
  <a href="/aprobaciones">Aprobaciones</a>
</nav>
<main>
  <div class="top">
    <div>
      <h1>Tools</h1>
      <p class="sub">Operaciones tipadas contra sistemas. Se definen en código (<code>src/tools/</code>) y se registran solas al arrancar. Acá las ves y las probás.</p>
    </div>
  </div>
  <div class="layout">
    <div class="izq" id="lista"></div>
    <div class="panel" id="panel"><div class="vacio">Elegí una tool a la izquierda.</div></div>
  </div>
</main>
<script src="/comun/espejo.js"></script>
<script>
let registro = null, legado = [], seleccion = null;

async function cargar() {
  registro = await api("/api/registro");
  const todas = await api("/api/tools");
  legado = todas.filter((t) => t.origen !== "codigo");
  renderLista();
  if (!seleccion && registro.tools.length) seleccionar(registro.tools[0].nombre);
}

function renderLista() {
  const grupos = agrupar(registro.tools, "modulo");
  let html = "";
  for (const [mod, tools] of Object.entries(grupos)) {
    html += `<h4>${esc(mod)}</h4>` + tools.map((t) => `<div class="item ${seleccion === t.nombre ? "activo" : ""}" onclick="seleccionar('${esc(t.nombre)}')">
      <span class="n">${esc(t.nombre)}</span>${t.requiereAprobacion ? "⏸" : ""}</div>`).join("");
  }
  if (legado.length) {
    html += `<h4>De la UI (legado)</h4>` + legado.map((t) => `<div class="item ${seleccion === "ui:" + t.id ? "activo" : ""}" onclick="seleccionarLegado('${t.id}')"><span class="n">${esc(t.nombre)}</span></div>`).join("");
  }
  document.getElementById("lista").innerHTML = html || `<p style="font-size:12px;color:var(--e-text-muted)">No hay tools registradas.</p>`;
}

function seleccionar(nombre) {
  seleccion = nombre; renderLista();
  const t = registro.tools.find((x) => x.nombre === nombre);
  document.getElementById("panel").innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h2>${esc(t.nombre)}</h2>${badge("código", "codigo")}${badge(t.riesgo, t.riesgo)}${t.requiereAprobacion ? badge("⏸ requiere aprobación", "aprobacion") : ""}${badge(`timeout ${t.timeoutSeg}s`, "neutro")}
    </div>
    <p class="sub" style="margin-top:8px;font-size:13px">${esc(t.descripcion)}</p>
    <div class="sec"><h3>Parámetros</h3>${tablaEsquema(t.parametros)}</div>
    <div class="sec"><h3>Probar</h3>
      <div id="form">${formEsquema(t.parametros)}</div>
      <button class="primario" style="margin-top:12px" onclick="probar()">▶ Ejecutar ahora</button>
      ${t.requiereAprobacion ? `<span style="font-size:11px;color:var(--e-text-muted);margin-left:8px">Desde acá se ejecuta directo: la aprobación la estás dando vos.</span>` : ""}
      <div id="resultado"></div>
    </div>
    <div class="sec"><h3>Cómo la ve el modelo</h3>
      <pre style="font-size:11px;color:var(--e-text-sec);white-space:pre-wrap;margin:0">${esc(JSON.stringify({ name: t.nombre, description: t.descripcion, parameters: t.parametros }, null, 2))}</pre>
    </div>`;
}

function seleccionarLegado(id) {
  seleccion = "ui:" + id; renderLista();
  const t = legado.find((x) => x.id === id);
  document.getElementById("panel").innerHTML = `
    <div style="display:flex;align-items:center;gap:8px"><h2>${esc(t.nombre)}</h2>${badge("UI · legado", "ui")}</div>
    <p class="sub" style="margin-top:8px;font-size:13px">${esc(t.descripcion || "")}</p>
    <p style="font-size:12px;color:var(--e-text-muted);margin-top:14px">Esta tool fue creada desde la UI vieja y corre por el ejecutor legado (heurístico). Se retira cuando exista su módulo en código.</p>
    <pre style="font-size:11px;color:var(--e-text-sec);white-space:pre-wrap">${esc(JSON.stringify(t.secciones, null, 2))}</pre>
    <button onclick="borrarLegado('${t.id}')" style="color:#ff8080;margin-top:10px">Borrar</button>`;
}
async function borrarLegado(id) {
  if (!confirm("¿Borrar esta tool de la UI?")) return;
  await del(`/api/tools/${id}`); seleccion = null; await cargar();
}

async function probar() {
  const t = registro.tools.find((x) => x.nombre === seleccion);
  const args = leerForm(document.getElementById("form"));
  const out = document.getElementById("resultado");
  out.innerHTML = `<p style="font-size:12px;color:var(--e-text-muted);margin-top:10px">Ejecutando…</p>`;
  try {
    const r = await fetch(`/api/registro/tools/${t.nombre}/probar`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ args }) });
    out.innerHTML = renderResultado(await r.json());
  } catch (e) { out.innerHTML = renderResultado({ ok: false, error: e.message }); }
}
cargar();
</script>
</body>
</html>
