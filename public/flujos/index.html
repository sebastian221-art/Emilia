<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flujos · Emilia</title>
<link rel="stylesheet" href="/comun/estilos.css" />
<link rel="stylesheet" href="/comun/lienzo.css" />
<style>
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.layout { display: grid; grid-template-columns: 180px 1fr; gap: 12px; height: calc(100vh - 160px); }
.paleta { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.paleta h4 { font-size: 11px; color: var(--e-text-muted); text-transform: uppercase; margin: 8px 0 2px; }
.pal-nodo { padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: grab; border: 1px solid var(--e-border);
  display: flex; align-items: center; gap: 7px; user-select: none; background: var(--e-surface); }
.pal-nodo:active { cursor: grabbing; }
.pal-ic { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.lienzo-cont { height: calc(100vh - 160px); }
.nodo-fl { position: absolute; min-width: 130px; background: var(--e-surface); border: 1.5px solid var(--e-border);
  border-radius: 10px; padding: 8px 10px; cursor: move; user-select: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.nodo-fl.sel { border-color: var(--e-accent); box-shadow: 0 0 0 3px var(--e-accent-bg); }
.nodo-fl .titulo { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.nodo-fl .sub { font-size: 11px; color: var(--e-text-sec); margin-top: 3px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nodo-ic { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
.nodo-fl { z-index: 2; }
.punto-con { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--e-accent);
  border: 2px solid var(--e-surface); cursor: crosshair; }
.punto-out { bottom: -6px; left: 50%; transform: translateX(-50%); }
.punto-in { top: -6px; left: 50%; transform: translateX(-50%); background: var(--e-text-muted); }
.hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: var(--e-text-muted); z-index: 5; }
</style>
</head>
<body>
<nav>
  <span class="marca">Emilia</span>
  <a href="/crear">Crear agente</a>
  <a href="/agentes">Ver agentes</a>
  <a href="/skills">Skills</a>
  <a href="/tools">Tools</a>
  <a href="/flujos" class="activo">Flujos</a>
  <a href="/aprobaciones">Aprobaciones</a>
</nav>
<main>
  <div class="top">
    <div>
      <h1>Flujos de trabajo</h1>
      <p class="sub">Arrastrá nodos al lienzo. Rueda = zoom · arrastrar el fondo = mover · doble clic = configurar.</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="selectorFlujo" onchange="cargarFlujo(this.value)" style="width:auto"><option value="">— Nuevo flujo —</option></select>
      <input id="nombreFlujo" placeholder="Nombre del flujo" style="width:auto" />
      <button class="primario" onclick="guardarFlujo()">Guardar</button>
      <button onclick="ejecutarFlujo()">▶ Ejecutar</button>
    </div>
  </div>

  <div class="layout">
    <div class="paleta" id="paleta"></div>
    <div class="lienzo-cont" id="lienzoCont">
      <div class="hint" id="hint">Arrastrá un nodo desde la izquierda para empezar. Empezá por "Inicio".</div>
      <div class="mundo" id="mundo">
        <svg class="conexiones" id="svgCon"></svg>
        <div id="lienzo"></div>
      </div>
      <div class="zoom-ctrl">
        <button onclick="zoomOut()">−</button>
        <span class="zoom-nivel" id="zoomNivel">100%</span>
        <button onclick="zoomIn()">+</button>
        <button onclick="centrar()" title="Centrar">⌂</button>
      </div>
    </div>
  </div>
</main>

<div id="modal-nodo" style="display:none;position:fixed;inset:0;background:rgba(8,6,13,.6);z-index:50;align-items:center;justify-content:center" onclick="if(event.target===this)cerrarModalNodo()"></div>

<script src="/flujos/tipos-nodo.js"></script>
<script src="/flujos/flujos.js"></script>
</body>
</html>
