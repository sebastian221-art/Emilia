<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crear agente · Emilia</title>
<link rel="stylesheet" href="/comun/estilos.css" />
<link rel="stylesheet" href="/comun/lienzo.css" />
<style>
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 12px; height: calc(100vh - 170px); }
.paleta { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
.paleta h4 { font-size: 10px; color: var(--e-text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 3px; }
.pal-pieza { padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: grab; border: 1px solid var(--e-border);
  display: flex; align-items: center; gap: 7px; user-select: none; background: var(--e-surface); }
.pal-pieza:hover { border-color: var(--e-accent); }
.pal-pieza.usada { opacity: .4; }
.pal-ic { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; background: var(--e-accent-bg); color: var(--e-accent); }
.lienzo-cont { height: calc(100vh - 170px); }
.agente-central { position: absolute; left: 500px; top: 350px; width: 180px;
  background: var(--e-surface); border: 2px solid var(--e-accent); border-radius: 16px; padding: 16px; z-index: 3;
  box-shadow: 0 0 40px rgba(124,58,237,.4); text-align: center; }
.agente-central .av { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 8px;
  background: radial-gradient(circle at 35% 30%, #7c3aed, #4c1d95); box-shadow: 0 0 24px rgba(124,58,237,.6);
  display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
.agente-central input { text-align: center; font-family: var(--syne); font-weight: 600; background: transparent; border: none; border-bottom: 1px solid var(--e-border); border-radius: 0; }
.pieza-nodo { position: absolute; width: 150px; background: var(--e-surface); border: 1px solid var(--e-border-strong);
  border-radius: 10px; padding: 9px 11px; cursor: move; user-select: none; z-index: 2; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
.pieza-nodo:hover { border-color: var(--e-accent); }
.pieza-nodo .pn-nom { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.pieza-nodo .pn-sub { font-size: 10px; color: var(--e-text-sec); margin-top: 3px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pieza-nodo .pn-x { position: absolute; top: 4px; right: 6px; color: var(--e-text-muted); cursor: pointer; font-size: 12px; }
.pieza-nodo .pn-x:hover { color: #ff8080; }
.hint { position: absolute; top: 14px; left: 16px; font-size: 12px; color: var(--e-text-muted); z-index: 5; }
</style>
</head>
<body>
<nav>
  <span class="marca">Emilia</span>
  <a href="/crear" class="activo">Crear agente</a>
  <a href="/agentes">Ver agentes</a>
  <a href="/skills">Skills</a>
  <a href="/tools">Tools</a>
  <a href="/flujos">Flujos</a>
  <a href="/aprobaciones">Aprobaciones</a>
</nav>
<main>
  <div class="top">
    <div>
      <h1>Nuevo agente</h1>
      <p class="sub">Arrastrá piezas al agente. Rueda = zoom · arrastrar el fondo = mover · clic en pieza = configurar.</p>
    </div>
    <button class="primario" onclick="crearAgente()">Crear agente</button>
  </div>
  <div class="layout">
    <div class="paleta" id="paleta"></div>
    <div class="lienzo-cont" id="lienzoCont">
      <div class="hint">Arrastrá piezas desde la izquierda hacia el agente →</div>
      <div class="mundo" id="mundo">
        <svg id="svgCon"></svg>
        <div id="agenteCentral" class="agente-central">
          <div class="av">✦</div>
          <input id="nombreAgente" placeholder="Nombre" value="" oninput="estado.identidad.nombre=this.value" />
          <div style="font-size:10px;color:var(--e-text-muted);margin-top:6px">agente</div>
        </div>
        <div id="piezasConectadas"></div>
      </div>
      <div class="zoom-ctrl">
        <button onclick="zoomOut()">−</button>
        <span class="zoom-nivel" id="zoomNivel">100%</span>
        <button onclick="zoomIn()">+</button>
        <button onclick="centrar()" title="Centrar">⌂</button>
      </div>
    </div>
  </div>
</main>
<div id="modal-cfg" style="display:none;position:fixed;inset:0;background:rgba(8,6,13,.6);z-index:50;align-items:center;justify-content:center" onclick="if(event.target===this)cerrarCfg()"></div>

<script src="/crear/piezas-1.js"></script>
<script src="/crear/piezas-2.js"></script>
<script src="/crear/crear.js"></script>
</body>
</html>
